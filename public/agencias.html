<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>(function(){const t=localStorage.getItem("hotellens_theme")||"light";document.documentElement.setAttribute("data-theme",t)})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agências — Hotel Lens</title>
  <link rel="icon" href="/assets/logo-mark.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="agencias">
  <main id="conteudo" class="wrap">
    <div class="page-head"><h1>Agências de turismo</h1></div>
    <form id="agency-filters" class="search-box">
      <div class="search-row">
        <input type="search" name="q" placeholder="Nome, destino ou serviço">
        <button class="btn-primary" type="submit">Filtrar</button>
      </div>
      <div class="filters">
        <div class="field"><label>Localização</label><input name="city"></div>
        <div class="field"><label>Destinos</label><input name="destinations"></div>
        <div class="field"><label>Serviços</label><input name="services"></div>
        <div class="field"><label>Tipo de viagem</label><input name="travelTypes"></div>
        <div class="field"><label>Ordenar</label>
          <select name="sort"><option value="relevance">Relevância</option><option value="name">Nome</option></select>
        </div>
      </div>
      <button class="btn-ghost" type="button" data-clear>Limpar filtros</button>
    </form>
    <p class="status" id="agency-status"></p>
    <div class="grid-cards" id="agency-results"></div>
  </main>
  <script type="module" src="/js/layout.js"></script>
  <script type="module">
    import { bindListing } from "/js/listing.js";
    bindListing({ type: "agency", formId: "agency-filters", resultsId: "agency-results", statusId: "agency-status" });
  </script>
</body>
</html>
