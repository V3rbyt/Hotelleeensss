<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar e-mail — Hotel Lens</title>
  <link rel="icon" href="/assets/logo-mark.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="verificar">
  <main id="conteudo">
    <div class="panel auth-card">
      <div data-back="/configuracoes.html"></div>
      <h1>Verificar e-mail</h1>
      <div id="form-alert" class="hidden"></div>
      <form id="verify-form" class="form-grid">
        <div class="field"><label>Código de verificação</label><input name="token" required></div>
        <button class="btn-primary" type="submit">Verificar e-mail</button>
      </form>
      <p class="meta">Se você abriu o link do e-mail, o código já foi preenchido — é só confirmar.</p>
    </div>
  </main>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/auth-forms.js"></script>
</body>
</html>
