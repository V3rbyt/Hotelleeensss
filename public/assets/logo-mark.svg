<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" role="img" aria-label="Hotel Localslens">
  <!-- Topo do edifício/hotel em azul-marinho -->
  <path d="M13 38V14.5A3.5 3.5 0 0 1 16.5 11h23A3.5 3.5 0 0 1 43 14.5V38"
        fill="none" stroke="#0B2545" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Janelas em ciano -->
  <rect x="18" y="16" width="5" height="5" rx="1.2" fill="#00B4D8"/>
  <rect x="26" y="16" width="5" height="5" rx="1.2" fill="#00B4D8"/>
  <rect x="34" y="16" width="5" height="5" rx="1.2" fill="#00B4D8"/>
  <rect x="18" y="24" width="5" height="5" rx="1.2" fill="#00B4D8"/>
  <rect x="34" y="24" width="5" height="5" rx="1.2" fill="#00B4D8"/>
  <!-- Anéis concêntricos da lente (na frente do prédio) -->
  <circle cx="28" cy="38" r="15" fill="none" stroke="#0B2545" stroke-width="3"/>
  <circle cx="28" cy="38" r="11.5" fill="#F8FAFC" stroke="#00B4D8" stroke-width="2.5"/>
  <!-- Núcleo da lente em ciano vibrante -->
  <circle cx="28" cy="38" r="7.8" fill="#00B4D8"/>
  <!-- Pálio / obturador da câmera (hexágono + três lâminas) -->
  <g transform="translate(28,38)" fill="none" stroke="#0B2545" stroke-width="1.8" stroke-linejoin="round">
    <path d="M0 -6.6 5.7 -3.3 5.7 3.3 0 6.6 -5.7 3.3 -5.7 -3.3Z"/>
    <path d="M0 -6.6 5.7 3.3M-5.7 -3.3 5.7 3.3M0 6.6 -5.7 -3.3"/>
  </g>
  <!-- Brilho do vidro -->
  <circle cx="24.5" cy="34.5" r="1.5" fill="#EAF9FD"/>
</svg>
