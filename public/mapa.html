<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>(function(){const t=localStorage.getItem("localslens_theme")||"light";document.documentElement.setAttribute("data-theme",t)})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa — Hotel Localslens</title>
  <link rel="icon" href="/assets/logo-mark.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="mapa">
  <div class="map-shell">
    <aside class="map-side">
      <h1>Mapa interativo</h1>
      <p class="meta">Busque cidades, bairros, ruas, hotéis ou atrações. A geocodificação usa Nominatim/OpenStreetMap. Cadastros da Hotel Localslens só aparecem se tiverem coordenadas reais.</p>
      <form id="map-search">
        <div class="field"><label for="map-q">Buscar lugar</label><input id="map-q" name="q" placeholder="Ex.: Av. Afonso Pena, Belo Horizonte"></div>
        <button class="btn-primary" type="submit">Localizar</button>
        <button class="btn-ghost" type="button" id="map-reset">Visão inicial</button>
      </form>
      <p class="status" id="map-status"></p>
      <ul class="suggest" id="map-suggest"></ul>
    </aside>
    <div id="map" role="application" aria-label="Mapa"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/map-page.js"></script>
</body>
</html>
